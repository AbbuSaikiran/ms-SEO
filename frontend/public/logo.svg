<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 90" width="520" height="90">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2D9A"/>
      <stop offset="100%" style="stop-color:#D400FF"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="100%" style="stop-color:#0066FF"/>
    </linearGradient>
    <filter id="glowPink" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="520" height="90" fill="#0D0D1A" rx="10"/>
  <ellipse cx="200" cy="45" rx="180" ry="40" fill="#5A00FF" opacity="0.08"/>
  <ellipse cx="400" cy="45" rx="120" ry="35" fill="#0066FF" opacity="0.07"/>
  <text x="24" y="58" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="800" font-size="42" letter-spacing="-1" fill="#FFFFFF">SEO</text>
  <text x="138" y="58" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="800" font-size="42" letter-spacing="-1" fill="url(#pinkGrad)" filter="url(#glowPink)">Map</text>
  <text x="256" y="58" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="800" font-size="42" letter-spacing="-1" fill="url(#cyanGrad)" filter="url(#glowCyan)">Agent</text>
  <text x="24" y="78" font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="400" font-size="10.5" letter-spacing="2.5" fill="#8899AA">AI-POWERED SEO OPTIMIZATION &amp; AUTOMATION</text>
</svg>
